<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin dashboard — The Index</title><link rel="stylesheet" href="css/styles.css"></head><body><header class="site-header"><nav class="nav"><a class="brand" href="index.html">The <span>Index</span></a><div class="nav-links"><a href="index.html">View directory</a><a href="auth.html" data-auth-link>Sign out</a></div></nav></header><main class="admin-page"><section class="admin-hero"><p class="eyebrow">Administrator dashboard</p><h1>Review service requests.</h1><p>Approve the good ones, and they appear in The Index immediately.</p></section><section class="admin-content"><div id="notice" class="notice" hidden></div><div id="loading" class="loading">Checking access…</div><div id="dashboard" hidden><div class="stats" aria-label="Application summary"><div class="stat"><span>Needs review</span><strong id="pending-count">0</strong></div><div class="stat"><span>Published</span><strong id="approved-count">0</strong></div><div class="stat"><span>Not approved</span><strong id="rejected-count">0</strong></div></div><div class="review-heading"><div><h2>Applications</h2><p id="review-caption">Loading submissions…</p></div><button class="button secondary small" id="refresh" type="button">Refresh</button></div><div class="filter-row" role="tablist" aria-label="Application status"><button class="filter active" data-filter="pending" role="tab" aria-selected="true">Needs review</button><button class="filter" data-filter="approved" role="tab" aria-selected="false">Published</button><button class="filter" data-filter="rejected" role="tab" aria-selected="false">Not approved</button><button class="filter" data-filter="all" role="tab" aria-selected="false">All</button></div><div id="applications" class="admin-list"></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script
