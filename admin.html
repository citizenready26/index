<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Review submitted services on The Index.">
<title>Admin — The Index</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="site-header">
  <nav class="nav">
    <a class="brand" href="index.html">The <span>Index</span></a>
    <div class="nav-links">
      <a href="index.html">Explore</a>
      <a href="apply.html">List your service</a>
      <a href="admin.html" data-admin-link hidden>Admin</a>
      <a href="auth.html" data-auth-link>Sign in</a>
    </div>
  </nav>
</header>

<main>
  <section class="section">
    <div class="container">
      <div class="section-heading">
        <div>
          <p class="eyebrow">Admin</p>
          <h2>Review queue</h2>
        </div>
      </div>

      <div class="tab-strip" role="tablist">
        <button class="active" data-status="pending" role="tab" aria-selected="true">Pending</button>
        <button data-status="approved" role="tab" aria-selected="false">Approved</button>
        <button data-status="rejected" role="tab" aria-selected="false">Rejected</button>
      </div>

      <div id="admin-queue">
        <p class="loading">Loading…</p>
      </div>
    </div>
  </section>
</main>

<footer class="footer"><div class="footer-inner">The Index · A reviewed service directory</div></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
