<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My dashboard — The Index</title><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><a class="brand" href="index.html">The Index<span>.</span></a><nav><a href="index.html">Discover</a><a class="active" href="dashboard.html">My dashboard</a></nav></header><main class="section"><p class="eyebrow">Provider dashboard</p><h1>Manage your listings.</h1><p>Pending and rejected listings remain visible here to their owner, but are never shown publicly.</p><p id="dashboardLoading">Loading your listings…</p><p class="notice" id="dashboardMessage" hidden></p><section><h2>Your listings</h2><div id="ownerListings"></div></section><section class="form-panel"><p class="eyebrow">Create or edit</p><h2 id="formTitle">Create a listing</h2><form id="listingForm" class="listing-form"><input type="hidden" name="id"><label>Business name<input name="name" required maxlength="120"></label><label>Category<select name="category" required><option>Web & apps</option><option>Design & creative</option><option>Home & repair</option><option>Health & wellness</option><option>Business & professional</option><option>Education & tutoring</option></select></label><label>Location<input name="location" required maxlength="120"></label><label>Website<input name="website" type="url" placeholder="https://"></label><label>Description<textarea name="description" required maxlength="1000"></textarea></label><button class="button button-dark">Submit for approval</button></form><label class="upload-label">Listing photo (save the listing first)<input type="file" id="photoInput" accept="image/*"></label></section></main><footer><a class="brand" href="index.html">The Index<span>.</span></a></footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script></body></html>
