<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>List your service — The Index</title><link rel="stylesheet" href="css/styles.css"></head><body><header class="site-header"><nav class="nav"><a class="brand" href="index.html">The <span>Index</span></a><div class="nav-links"><a href="index.html">Explore</a><a href="admin.html" data-admin-link hidden>Admin</a><a href="auth.html" data-auth-link>Sign in</a></div></nav></header><main class="page"><section class="panel"><h1>List your service</h1><p class="lede">Complete your provider details, then send your service for review. Only approved services become public.</p><div id="notice" class="notice" hidden></div><form id="application-form" hidden><div class="form-grid"><div class="field"><label for="full-name">Your full name</label><input id="full-name" required autocomplete="name"></div><div class="field"><label for="phone">Phone number</label><input id="phone" required autocomplete="tel"></div><div class="field full"><label for="business-name">Business or provider name</label><input id="business-name" required></div><div class="field"><label for="service-name">Service title</label><input id="service-name" placeholder="e.g. Home electrical repairs" required></div><div class="field"><label for="category">Category</label><input id="category" placeholder="e.g. Home services" required></div><div class="field"><label for="city">City / service area</label><input id="city" required></div><div class="field"><label for="website">Website (optional)</label><input id="website" type="url" placeholder="https://"></div><div class="field full"><label for="description">Describe your service</label><textarea id="description" maxlength="1500" required></textarea></div><div class="field full"><label for="image">Cover image (optional)</label><input id="image" type="file" accept="image/jpeg,image/png,image/webp"><span class="help">JPG, PNG, or WebP; maximum 5 MB.</span></div></div><button class="button" id="submit" type="submit">Submit for review</button></form></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/supabase-client.js"></script><script src="js/apply.js"></script></body></html>
