<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="List your service on The Index.">
<title>List your service — The Index</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="site-header">
  <nav class="nav">
    <a class="brand" href="index.html">The <span>Index</span></a>
    <div class="nav-links">
      <a href="index.html">Explore</a>
      <a href="apply.html">List your service</a>
      <a href="admin.html" data-admin-link hidden>Admin</a>
      <a href="auth.html" data-auth-link>Sign in</a>
    </div>
  </nav>
</header>

<main>
  <section class="hero" style="padding:48px 0 32px;">
    <div class="hero-inner">
      <p class="eyebrow">Providers</p>
      <h1 style="font-size:clamp(28px,4vw,38px);">List your service</h1>
      <p class="lede">Submit a service for review. It appears in the public directory once approved.</p>
    </div>
  </section>

  <section class="section" style="padding-top:0;">
    <div class="container">
      <div class="form-card">
        <p class="form-message" data-message hidden></p>
        <form data-panel="apply">
          <div class="field">
            <label for="service-title">Service name</label>
            <input type="text" id="service-title" required>
          </div>
          <div class="field">
            <label for="service-category">Category</label>
            <input type="text" id="service-category" required placeholder="e.g. Plumbing, Web design, Tutoring">
          </div>
          <div class="field">
            <label for="service-description">Description</label>
            <textarea id="service-description" required maxlength="600" placeholder="What do you offer, and who is it for?"></textarea>
          </div>
          <div class="field">
            <label for="service-website">Website (optional)</label>
            <input type="url" id="service-website" placeholder="https://">
          </div>
          <div class="field">
            <label for="service-contact">Contact email</label>
            <input type="email" id="service-contact" required>
          </div>
          <button type="submit" class="button-link">Submit for review</button>
        </form>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="section-heading">
        <div>
          <p class="eyebrow">Your submissions</p>
          <h2>Status</h2>
        </div>
      </div>
      <div id="my-services">
        <p class="loading">Loading…</p>
      </div>
    </div>
  </section>
</main>

<footer class="footer"><div class="footer-inner">The Index · A reviewed service directory</div></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/apply.js"></script>
</body>
</html>
