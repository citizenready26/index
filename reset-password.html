<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Set a new password for The Index.">
<title>Reset password — The Index</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="site-header">
  <nav class="nav">
    <a class="brand" href="index.html">The <span>Index</span></a>
    <div class="nav-links">
      <a href="index.html">Explore</a>
    </div>
  </nav>
</header>

<main>
  <section class="section">
    <div class="container">
      <div class="form-card">
        <div class="section-heading" style="border:none;padding:0;margin-bottom:20px;">
          <div><h2>Choose a new password</h2></div>
        </div>

        <p class="form-message" data-message hidden></p>

        <form data-panel="reset">
          <div class="field">
            <label for="new-password">New password</label>
            <input type="password" id="new-password" required minlength="8" autocomplete="new-password">
            <p class="field-hint">At least 8 characters.</p>
          </div>
          <button type="submit" class="button-link">Update password</button>
        </form>
      </div>
    </div>
  </section>
</main>

<footer class="footer"><div class="footer-inner">The Index · A reviewed service directory</div></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supabase-client.js"></script>
<script>
  // Supabase's reset-password redirect arrives with a recovery token in the
  // URL; the JS client exchanges it for a session automatically on load.
  document.addEventListener('DOMContentLoaded', () => {
    const form = document.querySelector('[data-panel="reset"]');
    const msg = document.querySelector('[data-message]');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('new-password').value;
      const { error } = await window.supabaseClient.auth.updateUser({ password });

      msg.hidden = false;
      if (error) {
        msg.textContent = error.message;
        msg.className = 'form-message error';
        return;
      }
      msg.textContent = 'Password updated. Redirecting to sign in…';
      msg.className = 'form-message success';
      setTimeout(() => { window.location.href = 'auth.html'; }, 1500);
    });
  });
</script>
</body>
</html>
