<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in — The Index</title><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><a class="brand" href="index.html">The Index<span>.</span></a></header><main class="section"><p class="eyebrow">For providers</p><h1>Sign in to list your service.</h1><p>Use your account or create one to submit a listing for review.</p><form id="authForm" class="listing-form form-panel"><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" required minlength="6"></label><div><button class="button button-dark" name="action" value="signin">Sign in</button><button class="button" name="action" value="signup">Create account</button></div></form><p class="notice" id="authMessage" hidden></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>document.getElementById('authForm').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.currentTarget),b=e.submitter,n=document.getElementById('authMessage'),api=window.supabase.createClient(window.THE_INDEX_SUPABASE_URL,window.THE_INDEX_SUPABASE_ANON_KEY),c={email:f.get('email'),password:f.get('password')},r=b.value==='signup'?await api.auth.signUp(c):await api.auth.signInWithPassword(c);n.hidden=false;if(r.error){n.className='notice error';n.textContent=r.error.message;return}if(b.value==='signup'&&!r.data.session){n.className='notice success';n.textContent='Account created. Check your email to confirm it, then sign in.';return}location.href=new URLSearchParams(location.search).get('next')||'dashboard.html'});</script></body></html>
