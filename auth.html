<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in — The Index</title><link rel="stylesheet" href="css/styles.css"></head><body><header class="site-header"><nav class="nav"><a class="brand" href="index.html">The <span>Index</span></a><div class="nav-links"><a href="index.html">Explore</a><a href="apply.html">List your service</a></div></nav></header><main class="page"><section class="panel"><div class="tab-row"><button class="tab active" data-mode="signin">Sign in</button><button class="tab" data-mode="signup">Create account</button></div><h1 id="form-title">Welcome back</h1><p class="lede" id="form-lede">Sign in to manage your service applications.</p><div id="notice" class="notice" hidden></div><form id="auth-form"><div class="field"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" minlength="8" required></div><p class="help" id="signup-help" hidden>Use at least 8 characters. You may need to confirm your email before signing in.</p><button class="button" id="submit" type="submit">Sign in</button></form><p class="auth-switch"><a href="#" id="forgot-link">Forgot your password?</a></p><form id="forgot-form" hidden><div class="field"><label for="reset-email">Email address</label><input id="reset-email" type="email" autocomplete="email" required></div><button class="button" id="reset-submit" type="submit">Send reset link</button><p class="auth-switch"><a href="#" id="back-link">Back to sign in</a></p></form></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/supabase-client.js"></script><script src="js/auth.js"></script></body></html>
