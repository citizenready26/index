<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Sign in or create an account on The Index.">
<title>Sign in — The Index</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="site-header">
  <nav class="nav">
    <a class="brand" href="index.html">The <span>Index</span></a>
    <div class="nav-links">
      <a href="index.html">Explore</a>
      <a href="apply.html">List your service</a>
      <a href="admin.html" data-admin-link hidden>Admin</a>
      <a href="auth.html" data-auth-link>Sign in</a>
    </div>
  </nav>
</header>

<main>
  <section class="section">
    <div class="container">
      <div class="form-card">
        <div class="form-tabs" role="tablist">
          <button class="form-tab active" data-tab="signin" role="tab" aria-selected="true">Sign in</button>
          <button class="form-tab" data-tab="signup" role="tab" aria-selected="false">Create account</button>
          <button class="form-tab" data-tab="forgot" role="tab" aria-selected="false">Forgot password</button>
        </div>

        <p class="form-message" data-message hidden></p>

        <!-- Sign in -->
        <form data-panel="signin">
          <div class="field">
            <label for="signin-email">Email</label>
            <input type="email" id="signin-email" required autocomplete="email">
          </div>
          <div class="field">
            <label for="signin-password">Password</label>
            <input type="password" id="signin-password" required autocomplete="current-password">
          </div>
          <button type="submit" class="button-link">Sign in</button>
        </form>

        <!-- Sign up -->
        <form data-panel="signup" hidden>
          <div class="field">
            <label for="signup-business">Business or service name</label>
            <input type="text" id="signup-business" required>
          </div>
          <div class="field">
            <label for="signup-email">Email</label>
            <input type="email" id="signup-email" required autocomplete="email">
          </div>
          <div class="field">
            <label for="signup-password">Password</label>
            <input type="password" id="signup-password" required minlength="8" autocomplete="new-password">
            <p class="field-hint">At least 8 characters.</p>
          </div>
          <button type="submit" class="button-link">Create account</button>
        </form>

        <!-- Forgot password -->
        <form data-panel="forgot" hidden>
          <div class="field">
            <label for="forgot-email">Email</label>
            <input type="email" id="forgot-email" required autocomplete="email">
          </div>
          <button type="submit" class="button-link">Send reset link</button>
        </form>
      </div>
    </div>
  </section>
</main>

<footer class="footer"><div class="footer-inner">The Index · A reviewed service directory</div></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
